name: Reconcile Fenton 2025 with current main

on:
  push:
    branches:
      - activate-fenton-2025
    paths:
      - .github/workflows/reconcile-fenton-2025.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: activate-fenton-2025

      - name: Rebuild Fenton activation on current main without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # Preserve only the reviewed Fenton 2025 delta from the pre-batch baseline.
          git diff 0990a70106968aadbb9e65d54f357367dd5bff90..5e92ea8a35b5f3a17c2791ce7f36c5985b09bd01 -- \
            packages/core/src/catalog/clinicalTools.ts \
            packages/core/src/discovery/toolDiscovery.ts \
            packages/core/tests/calculatorRegistry.test.ts \
            packages/core/tests/catalog.test.ts \
            packages/core/tests/discoveryTaxonomy.test.ts \
            packages/core/tests/fenton2025.test.ts \
            packages/core/tests/sprint50Safety.test.ts \
            > /tmp/fenton-core.patch

          # Make current main an explicit parent without changing history by force.
          git merge -s ours origin/main -m "merge: anchor Fenton activation to current main"

          # Rebuild the tree from current main, then reapply only the Fenton delta.
          git read-tree --reset -u origin/main
          git apply --3way --index /tmp/fenton-core.patch

          # Add the external Fenton entry points to the CURRENT V3 ToolPage rather than
          # restoring the older pre-V3 ToolPage from the activation branch.
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/routes/ToolPage.tsx')
          text = path.read_text()
          anchor = '          {hasActiveCalculation ? (\n'
          if anchor not in text:
              raise SystemExit('ToolPage calculator anchor not found')
          block = '''          {tool.id === "fenton_2025_growth" ? (\n            <section className="content-panel surface-availability-note" id="calculator">\n              <strong>\n                {language === "es"\n                  ? "Fenton 2025 · tercera generación"\n                  : "Fenton 2025 · third generation"}\n              </strong>\n              <p>\n                {language === "es"\n                  ? "PedsCore mantiene Fenton 2025 como herramienta externa: no redistribuye ni recalcula localmente los datos de las curvas. Usa PediTools para percentiles y z-scores puntuales o el plotter oficial de Fenton Growth para seguimiento longitudinal."\n                  : "PedsCore keeps Fenton 2025 as an external tool: it does not redistribute or locally recalculate the chart data. Use PediTools for point percentiles and Z-scores or the official Fenton Growth plotter for longitudinal follow-up."}\n              </p>\n              <div className="tool-actions">\n                <a className="primary-link" href="https://peditools.org/fenton2025/" rel="noreferrer" target="_blank">\n                  {language === "es" ? "Abrir calculadora Fenton 2025 en PediTools ↗" : "Open Fenton 2025 calculator on PediTools ↗"}\n                </a>\n                <a className="secondary-link" href="https://fentongrowth.ca/" rel="noreferrer" target="_blank">\n                  {language === "es" ? "Abrir plotter oficial Fenton Growth ↗" : "Open official Fenton Growth plotter ↗"}\n                </a>\n              </div>\n            </section>\n          ) : hasActiveCalculation ? (\n'''
          path.write_text(text.replace(anchor, block, 1))
          PY

          git add apps/web/src/routes/ToolPage.tsx
          git add -A
          git commit -m "reconcile: Fenton 2025 activation on current main"
          git push origin HEAD:activate-fenton-2025
