name: Diagnose AAP test pipeline

on:
  push:
    branches:
      - activate-aap2022-hyperbilirubinemia
    paths:
      - .github/workflows/diagnose-aap-pipeline.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure source, dist and post-prebuild
        shell: bash
        run: |
          set -euo pipefail
          npx tsx -e 'import { getAllTools, getImplementedTools } from "./packages/core/src/index.ts"; console.log("SOURCE", getAllTools().length, getImplementedTools().length);'
          npm run build -w @peds-core/core
          node --input-type=module -e 'import { getAllTools, getImplementedTools } from "@peds-core/core"; console.log("DIST", getAllTools().length, getImplementedTools().length);'
          npm run prebuild -w @peds-core/web
          node --input-type=module -e 'import { getAllTools, getImplementedTools } from "@peds-core/core"; console.log("POST_PREBUILD_DIST", getAllTools().length, getImplementedTools().length);'
          node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("apps/web/public/sitemap.xml","utf8"); console.log("SITEMAP_LOCS", (s.match(/<loc>/g)||[]).length); console.log("AAP_IN_SITEMAP", s.includes("aap-2022-hyperbilirubinemia"));'
