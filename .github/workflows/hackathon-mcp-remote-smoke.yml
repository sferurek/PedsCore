name: Hackathon MCP Remote Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # This is a live Railway MCP integration check, not a general web-app check.
    # Run on PRs changing MCP contracts or this smoke script only.
    # Other PedsCore UI/catalog changes are covered by the main CI workflow.
    paths:
      - "apps/mcp-server/**"
      - "packages/core/src/mcp/**"
      - "scripts/remote-mcp-smoke.mjs"
  push:
    branches:
      - hackathon/alexa-mcp-v3
      - main
    paths:
      - "apps/mcp-server/**"
      - "packages/core/src/mcp/**"
      - "scripts/remote-mcp-smoke.mjs"

permissions:
  contents: read

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MCP_REMOTE_BASE_URL: https://pedscore-ai-mcp-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for and validate Railway MCP endpoint
        run: node scripts/remote-mcp-smoke.mjs
