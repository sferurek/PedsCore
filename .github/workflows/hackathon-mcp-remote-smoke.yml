name: Hackathon MCP Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - hackathon/alexa-mcp-v3
      - main
    paths:
      - "apps/mcp-server/**"
      - "packages/core/src/mcp/**"
      - ".github/workflows/hackathon-mcp-remote-smoke.yml"
      - "scripts/remote-mcp-smoke.mjs"

permissions:
  contents: read

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MCP_REMOTE_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Verify local MCP and public synthetic SIM bridge
        shell: bash
        run: |
          npm run hackathon:local -- --with-sim > /tmp/pedscore-mcp.log 2>&1 &
          server=$!
          trap 'kill -TERM "$server" 2>/dev/null || true; cat /tmp/pedscore-mcp.log' EXIT
          node scripts/remote-mcp-smoke.mjs
