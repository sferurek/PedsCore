name: Finalize RDAI

on:
  push:
    branches:
      - activate-rdai

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[rdai-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate-rdai
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply finalizer
        run: python .github/scripts/finalize_rdai.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit clean RDAI branch
        run: |
          rm -f .github/workflows/rdai-activate.yml .github/scripts/finalize_rdai.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize original RDAI activation [rdai-ready]"
          git push origin HEAD:activate-rdai
