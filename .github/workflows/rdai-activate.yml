name: Finalize RDAI

on:
  push:
    branches: [activate-rdai]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[rdai-ready]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate-rdai
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix RDAI option identifiers and clean staging files
        shell: python
        run: |
          from pathlib import Path
          p = Path('packages/core/src/catalog/clinicalTools.ts')
          s = p.read_text()
          s = s.replace('({ value, label: { es: String(value), en: String(value) } })', '({ id: String(value), value, label: { es: String(value), en: String(value) } })')
          p.write_text(s)
          for name in ['README.tmp-rdai','README.tmp-rdai-2','README.tmp-rdai-3']:
            q = Path(name)
            if q.exists(): q.unlink()
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm test -- --run
          npm run build
      - name: Commit final implementation
        run: |
          rm -f .github/workflows/rdai-activate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize RDAI activation [rdai-ready]"
          git push origin HEAD:activate-rdai
