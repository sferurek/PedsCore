name: CI

on:
  push:
    branches:
      - main
      - hackathon/alexa-mcp-v3
  pull_request:

jobs:
  validate:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Governance audit
        run: npm run audit:governance

      - name: SEO audit
        run: npm run seo:check

      - name: Validate Alexa+ manifest
        run: npm run alexa:validate
