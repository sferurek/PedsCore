name: Reconcile AAP 2022 v2

on:
  push:
    branches:
      - activate-aap2022-hyperbilirubinemia
    paths:
      - .github/workflows/reconcile-aap2022-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: activate-aap2022-hyperbilirubinemia
      - name: Rebuild AAP 2022 on current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git diff 0990a70106968aadbb9e65d54f357367dd5bff90..5446018672cc04240ee18de90dcf362b3a0fe5b1 -- \
            packages/core/src/catalog/clinicalTools.ts \
            packages/core/tests/aap2022Hyperbilirubinemia.test.ts \
            > /tmp/aap-core.patch

          git merge -s ours origin/main -m "merge: anchor AAP 2022 activation to current main"
          git read-tree --reset -u origin/main
          git apply --3way --index /tmp/aap-core.patch

          python - <<'PY'
          from pathlib import Path

          # Discovery: insert only the new AAP entry into the current Fenton/Bedside-aware map.
          p = Path('packages/core/src/discovery/toolDiscovery.ts')
          text = p.read_text()
          anchor = '  bhutani_nomogram: d({ specialties:[...neo,"gastroenterology"], problems:["hyperbilirubinemia","jaundice"], ages:["term_newborn","neonate_0_28d"], settings:["newborn_ward","outpatient_clinic"], functions:["risk_stratification","reference_only"], modes:["visual_atlas","reference_scale"], longitudinal:"possible", calc:"not_applicable", reuse:"permission_required", risk:"high", inputs:["laboratory"], es:["bhutani","nomograma bilirrubina","ictericia"], en:["bhutani nomogram","bilirubin nomogram"], compare:["neonatal_hyperbilirubinemia"] }),\n'
          aap = '  aap_2022_hyperbilirubinemia: d({ specialties:[...neo,"gastroenterology"], problems:["hyperbilirubinemia","jaundice"], ages:["preterm","term_newborn","neonate_0_28d"], exactAgeApplicability:{ minimumAgeDays:0, maximumAgeDaysExclusive:14.01 }, settings:["newborn_ward","nicu","outpatient_clinic"], functions:["risk_stratification","reference_only"], modes:["clinical_rule","licensed_external_tool"], longitudinal:"supported", calc:"external_official", reuse:"external_only", risk:"critical", inputs:["laboratory","history"], es:["aap 2022 bilirrubina","hiperbilirrubinemia neonatal","fototerapia","ictericia neonatal"], en:["aap 2022 bilirubin","neonatal hyperbilirubinemia","phototherapy threshold","newborn jaundice"], compare:["neonatal_hyperbilirubinemia"], related:["bhutani_nomogram"] }),\n'
          if '  aap_2022_hyperbilirubinemia:' not in text:
              if anchor not in text:
                  raise SystemExit('Bhutani discovery anchor not found')
              text = text.replace(anchor, anchor + aap, 1)
          p.write_text(text)

          # Current V3 ToolPage: state and URL preparation.
          p = Path('apps/web/src/routes/ToolPage.tsx')
          text = p.read_text()
          state_anchor = '''  const [formValues, setFormValues] = useState<FormValues>(() =>\n    getInitialFormState(formTool)\n  );\n'''
          if 'const [aapBiliGa' not in text:
              text = text.replace(state_anchor, state_anchor + '''  const [aapBiliGa, setAapBiliGa] = useState("40");\n  const [aapBiliAge, setAapBiliAge] = useState("48");\n  const [aapBiliTsb, setAapBiliTsb] = useState("");\n  const [aapBiliRisk, setAapBiliRisk] = useState("none");\n''', 1)
          seo_anchor = '  const seoProfile = useMemo(() => getToolSeoProfile(tool, language), [language, tool]);\n'
          if 'const aapBiliUrl' not in text:
              text = text.replace(seo_anchor, seo_anchor + '''  const aapBiliUrl = useMemo(() => {\n    const params = new URLSearchParams({ ga: aapBiliGa, age: aapBiliAge, risk: aapBiliRisk });\n    if (aapBiliTsb.trim()) params.set("bili", aapBiliTsb.trim());\n    return `https://peditools.org/bili2022/api/?${params.toString()}`;\n  }, [aapBiliAge, aapBiliGa, aapBiliRisk, aapBiliTsb]);\n''', 1)
          calc_anchor = '          {tool.id === "fenton_2025_growth" ? (\n'
          if 'tool.id === "aap_2022_hyperbilirubinemia" ?' not in text:
              block = '''          {tool.id === "aap_2022_hyperbilirubinemia" ? (\n            <section className="content-panel" id="calculator">\n              <div className="tool-section-heading">\n                <p className="eyebrow">{language === "es" ? "AAP 2022 · PEDIATRÍA NEONATAL" : "AAP 2022 · NEONATAL CARE"}</p>\n                <h2>{language === "es" ? "Calcular umbrales" : "Calculate thresholds"}</h2>\n              </div>\n              <p>{language === "es" ? "PedsCore prepara los parámetros y abre el cálculo en PediTools, cuya API 2022 es gratuita y no requiere registro ni licencia. Así evitamos reproducir localmente las curvas y tablas protegidas de la AAP." : "PedsCore prepares the parameters and opens the calculation in PediTools, whose 2022 API is free and requires no registration or license. This avoids locally reproducing the AAP threshold curves and tables."}</p>\n              <div className="dynamic-form">\n                <label><span>{language === "es" ? "Edad gestacional al nacimiento (semanas completas)" : "Gestational age at birth (completed weeks)"}</span><select value={aapBiliGa} onChange={(event) => setAapBiliGa(event.target.value)}><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40+</option></select></label>\n                <label><span>{language === "es" ? "Edad postnatal (horas)" : "Postnatal age (hours)"}</span><input type="number" min="1" max="336" step="1" value={aapBiliAge} onChange={(event) => setAapBiliAge(event.target.value)} /></label>\n                <label><span>{language === "es" ? "Bilirrubina total sérica, TSB (mg/dL)" : "Total serum bilirubin, TSB (mg/dL)"}</span><input type="number" min="0" step="0.1" placeholder={language === "es" ? "Opcional: deja vacío para ver solo umbrales" : "Optional: leave blank for thresholds only"} value={aapBiliTsb} onChange={(event) => setAapBiliTsb(event.target.value)} /></label>\n                <label><span>{language === "es" ? "Factores adicionales de neurotoxicidad" : "Additional neurotoxicity risk factors"}</span><select value={aapBiliRisk} onChange={(event) => setAapBiliRisk(event.target.value)}><option value="none">{language === "es" ? "Ninguno" : "None"}</option><option value="any">{language === "es" ? "Uno o más" : "One or more"}</option></select></label>\n              </div>\n              <p className="surface-availability-note">{language === "es" ? "Factores adicionales: albúmina <3 g/dL, enfermedad hemolítica isoimmune/G6PD u otra hemólisis, sepsis o inestabilidad clínica significativa en las últimas 24 h. La edad gestacional <38 semanas ya se incorpora al umbral por edad gestacional." : "Additional factors: albumin <3 g/dL, isoimmune hemolytic disease/G6PD deficiency or other hemolysis, sepsis, or significant clinical instability in the previous 24 h. Gestational age <38 weeks is already incorporated through the gestational-age-specific threshold."}</p>\n              <a className="primary-link" href={aapBiliUrl} rel="noreferrer" target="_blank">{language === "es" ? "Abrir cálculo AAP 2022 en PediTools ↗" : "Open AAP 2022 calculation in PediTools ↗"}</a>\n              <p>{language === "es" ? "Usa TSB para decisiones terapéuticas y no restes la fracción directa/conjugada. PediTools mostrará los umbrales de fototerapia y exanguinotransfusión y, cuando proceda, la distancia de la TSB al umbral." : "Use TSB for treatment decisions and do not subtract the direct/conjugated fraction. PediTools will display phototherapy and exchange-transfusion thresholds and, when applicable, the TSB distance from the treatment threshold."}</p>\n            </section>\n          ) : tool.id === "fenton_2025_growth" ? (\n'''
              if calc_anchor not in text:
                  raise SystemExit('Fenton calculator anchor not found')
              text = text.replace(calc_anchor, block, 1)
          p.write_text(text)

          # Inventory/count updates against main after Fenton + Bedside PEWS.
          p = Path('packages/core/tests/calculatorRegistry.test.ts'); t=p.read_text().replace('toHaveLength(28);','toHaveLength(29);',1); p.write_text(t)
          p = Path('packages/core/tests/catalog.test.ts'); t=p.read_text();
          section=t.split('const implementedToolIds = [',1)[1].split('];',1)[0]
          if '"aap_2022_hyperbilirubinemia"' not in section: t=t.replace('  "cries",\n','  "cries",\n  "aap_2022_hyperbilirubinemia",\n',1)
          t=t.replace('expect(getImplementedTools()).toHaveLength(28);','expect(getImplementedTools()).toHaveLength(29);',1).replace('expect(clinicalTools).toHaveLength(134);','expect(clinicalTools).toHaveLength(135);',1)
          marker='  it("keeps Block 8B-1 evidence-reviewed tools pending until implementation gates are complete", () => {'
          if 'publishes AAP 2022 hyperbilirubinemia as active external decision support' not in t:
              t=t.replace(marker,'''  it("publishes AAP 2022 hyperbilirubinemia as active external decision support", () => {\n    const tool = getTool("aap_2022_hyperbilirubinemia");\n    expect(tool?.implementationStatus).toBe("implemented");\n    expect(tool?.calculationStatus).not.toBe("active");\n    expect(tool?.references.some((reference) => reference.doi === "10.1542/peds.2022-058859")).toBe(true);\n    expect(tool?.validationNotes.en).toContain("PediTools API");\n  });\n\n'''+marker,1)
          p.write_text(t)
          p = Path('packages/core/tests/discoveryTaxonomy.test.ts'); p.write_text(p.read_text().replace('toHaveLength(116);','toHaveLength(117);',1))
          p = Path('packages/core/tests/sprint50Safety.test.ts'); t=p.read_text(); section=t.split('const expectedImplementedToolIds = [',1)[1].split('];',1)[0]
          if '"aap_2022_hyperbilirubinemia"' not in section: t=t.replace('  "cries",\n','  "cries",\n  "aap_2022_hyperbilirubinemia",\n',1)
          if 'aap_2022_hyperbilirubinemia: "aap2022Hyperbilirubinemia.test.ts"' not in t: t=t.replace('  cries: "cries.test.ts",\n','  cries: "cries.test.ts",\n  aap_2022_hyperbilirubinemia: "aap2022Hyperbilirubinemia.test.ts",\n',1)
          t=t.replace('expect(getImplementedTools()).toHaveLength(28);','expect(getImplementedTools()).toHaveLength(29);',1); p.write_text(t)
          p=Path('packages/core/tests/toolSeo.test.ts'); p.write_text(p.read_text().replace('toHaveLength(134)','toHaveLength(135)',1))
          p=Path('apps/web/src/utils/filterTools.test.ts'); p.write_text(p.read_text().replace('toBe(134)','toBe(135)',1))
          p=Path('apps/web/src/routes/webProductPolish.test.tsx'); t=p.read_text().replace('toHaveLength(134)','toHaveLength(135)',1).replace('toHaveLength(28)','toHaveLength(29)',1); p.write_text(t)
          p=Path('apps/web/src/utils/indexNow.test.ts'); p.write_text(p.read_text().replace('toHaveLength(319)','toHaveLength(321)',1))
          PY

          git add -A
          git rm -f --ignore-unmatch .github/workflows/reconcile-aap2022.yml .github/workflows/reconcile-aap2022-v2.yml
          git commit -m "reconcile: AAP 2022 hyperbilirubinemia on current main"
          git push origin HEAD:activate-aap2022-hyperbilirubinemia
