name: One-time dependency security audit

on:
  push:
    branches:
      - chore/dependency-security-audit

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit before fix
        run: npm audit || true

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Audit after fix
        run: npm audit || true

      - name: Commit lockfile remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): apply non-breaking npm audit remediation"
          git push
