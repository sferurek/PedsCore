name: Diagnose AAP runtime catalog

on:
  push:
    branches:
      - activate-aap2022-hyperbilirubinemia
    paths:
      - .github/workflows/diagnose-aap-runtime.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print runtime catalog from source
        run: |
          npx tsx -e 'import { getAllTools, getImplementedTools } from "./packages/core/src/index.ts"; const t=getAllTools(); console.log("SOURCE_ALL", t.length); console.log("SOURCE_IMPLEMENTED", getImplementedTools().length); console.log("AAP", t.filter(x=>x.id==="aap_2022_hyperbilirubinemia").length); console.log("FENTON", t.filter(x=>x.id==="fenton_2025_growth").length); console.log("BEDSIDE", t.filter(x=>x.id==="bedside_pews").length);'
